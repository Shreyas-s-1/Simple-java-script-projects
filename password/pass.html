<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #7c3aed);
            color: #e2e8f0;
        }

        .generator {
            width: min(90vw, 440px);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 22px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.35);
            padding: 30px 26px;
            text-align: center;
        }

        h1 {
            margin: 0 0 22px;
            font-size: clamp(1.8rem, 3vw, 2.3rem);
            color: #f8fafc;
        }

        #password {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 1px solid #94a3b8;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 1.05rem;
            text-align: center;
            outline: none;
        }

        #password::placeholder {
            color: #cbd5e1;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 20px rgba(59, 130, 246, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 28px rgba(59, 130, 246, 0.45);
        }
    </style>
</head>
<body>
    <div class="generator">
        <h1>Random Password Generator</h1>
        <input type="text" id="password" placeholder="Your password will appear here" readonly>
        <button onclick="createPass()">Generate Password</button>
    </div>

    <script>
        const passwordBox = document.getElementById("password");
        const length = 12;

        const lower = "abcdefghijklmnopqrstuvwxyz";
        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numbers = "0123456789";
        const symbols = "!@#$%^&*()_-+=<>?";

        const allChars = lower + upper + numbers + symbols;

        function createPass() {
            let password = "";

            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allChars.length);
                password += allChars[randomIndex];
            }

            passwordBox.value = password;
        }
    </script>
</body>
</html>
