<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: linear-gradient(145deg, #111827, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 380px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
        }

        h1 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #94a3b8;
            margin-bottom: 32px;
            font-weight: 700;
        }

        .display-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .emojy {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 16px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .name {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 500;
            text-transform: capitalize;
            min-height: 24px;
            word-break: break-word;
        }

        .btn {
            width: 100%;
            background: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h1>Emoji generator</h1>
        <div class="display-box">
            <div class="emojy"></div>
            <div class="name"></div>
        </div>
        <button class="btn">click</button>
    </div>

    <script>
        const emo = document.querySelector('.emojy');
        const nme = document.querySelector('.name');
        const btn = document.querySelector('.btn');
        let arr = [];

        async function emog(){
            const res = await fetch("https://emoji-api.com/emojis?access_key=773b58f681fb786fafdb8392e8b8a75ddc177fd1");
            const data = await res.json();

            for(let i = 0; i <= 100; i++){
                arr.push({
                    name: data[i].character,
                    code: data[i].unicodeName
                });
            }
        }

        emog();

        btn.addEventListener('click', () => {
            const ran = Math.floor(Math.random() * arr.length);

            emo.innerHTML = arr[ran].name;
            nme.innerHTML = arr[ran].code;
        });
    </script>

</body>
</html>
