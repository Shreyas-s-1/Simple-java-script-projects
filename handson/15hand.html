<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contain {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 48px 64px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .ding {
            font-size: 3rem;
            font-weight: 700;
            color: #38bdf8 !important;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>
    <div class="contain">
        <div class="ding"></div>
    </div>

    <script>
        const ding = document.querySelector('.ding');
        timer();
        function timer() {
            const date = new Date();
            ding.innerHTML = `${date.toLocaleTimeString()}`;
            setTimeout(timer, 1000);
        }
    </script>
</body>
</html>
