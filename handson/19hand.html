<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #e2e8f0;
        }

        .idk {
            width: 100%;
            height: 120px;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            outline: none;
            resize: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .idk:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item span {
            font-weight: 600;
            color: #4f46e5;
        }

        .remain.warning {
            color: #e11d48;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea placeholder="enter" class="idk" maxlength="50"></textarea>
        <div class="stats">
            <div class="stat-item">Count: <span class="count">0</span></div>
            <div class="stat-item">Remain: <span class="remain">50</span></div>
        </div>
    </div>

    <script>
        const dk = document.querySelector('.idk');
        const cnt = document.querySelector('.count');
        const rm = document.querySelector('.remain');

        dk.addEventListener('input', () => {
            const currentLength = dk.value.length;
            const maxLength = parseInt(dk.getAttribute("maxlength"));
            const remaining = maxLength - currentLength;

            cnt.innerText = currentLength;
            rm.innerText = remaining;

            if (remaining <= 10) {
                rm.classList.add('warning');
            } else {
                rm.classList.remove('warning');
            }
        });
    </script>
</body>
</html>
