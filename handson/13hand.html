<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
        }

        .h {
            font-size: 4rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 32px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #38bdf8;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="h">0</h1>
        <input type="range" id="rng" min="0" max="100" value="0">
    </div>

    <script>
        const rng = document.querySelector('#rng');
        const i = document.querySelector('.h');

        i.textContent = rng.value;

        rng.addEventListener('input', function() {
            i.textContent = this.value;
        });
    </script>
</body>
</html>
