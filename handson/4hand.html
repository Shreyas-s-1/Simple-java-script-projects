<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .contain {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 320px;
        }

        .h {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #111;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            padding: 12px;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.97);
        }

        .incre {
            background-color: #10b981;
            color: white;
        }
        .incre:hover { background-color: #059669; }

        .decre {
            background-color: #ef4444;
            color: white;
        }
        .decre:hover { background-color: #dc2626; }

        .reset {
            background-color: #e5e7eb;
            color: #374151;
            grid-column: span 2;
        }
        .reset:hover { background-color: #d1d5db; }

        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .ins {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ins:focus {
            border-color: #3b82f6;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 10px 16px;
        }
        .btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="contain">
        <h2 class="h">0</h2>

        <div class="controls-grid">
            <button class="incre">+1</button>
            <button class="decre">-1</button>
            <button class="reset">Reset</button>
        </div>

        <div class="input-group">
            <input type="number" class="ins" placeholder="Step amount">
            <button class="btn">Set</button>
        </div>
    </div>

    <script>
        const h = document.querySelector('.h');
        const incre = document.querySelector('.incre');
        const decre = document.querySelector('.decre');
        const reset = document.querySelector('.reset');
        const ins = document.querySelector('.ins');
        const btn = document.querySelector('.btn');

        let count = 0;
        let step = 1;

        btn.addEventListener('click', () => {
            const val = parseInt(ins.value);
            if (!isNaN(val)) {
                step = val;
            }
        });

        incre.addEventListener('click', () => {
            count += step;
            h.innerHTML = count;
        });

        decre.addEventListener('click', () => {
            count -= step;
            h.innerHTML = count;
        });

        reset.addEventListener('click', () => {
            count = 0;
            h.innerHTML = count;
        });
    </script>
</body>
</html>
